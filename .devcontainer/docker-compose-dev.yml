services:
  go-app:
    build:
      dockerfile: Dockerfile.Go
      context: .
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ..:/usr/src:Z

  node-server:
    image: node:24
    working_dir: /usr/src
    restart: always
    depends_on: 
      - go-app
    volumes:
      - ../frontend/:/usr/src:Z
    ports:
      - "3000:3000"
    command: >
      sh -c "npm install && npm run build && node build"
