services:
  go-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - .:/usr/src
      - $HOME/.hashbot_db:/database

  node-server:
    image: node:24
    working_dir: /usr/src
    volumes:
      - ./frontend/:/usr/src
    ports:
      - "80:3000"
    command: >
      sh -c "npm install && npm run build && node build"
