services:
  go-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - .:/usr/src

  node-server:
    image: node:24
    working_dir: /usr/src
    restart: always
    volumes:
      - ./frontend/:/usr/src
    ports:
      - "3000:3000"
    command: >
      sh -c "npm install && npm run build && node build"
