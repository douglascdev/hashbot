services:
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel run ${CLOUDFLARE_TOKEN}
    environment:
      - CLOUDFLARE_TOKEN=${CLOUDFLARE_TOKEN}

  go-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - .:/usr/src
      - $HOME/.hashbot_db:/database
    depends_on:
      - cloudflare-tunnel

  node-server:
    image: node:24
    depends_on:
      - cloudflare-tunnel
    working_dir: /usr/src/app
    volumes:
      - ./frontend/:/usr/src/app
    ports:
      - "80:3000"
    command: >
      sh -c "npm install && npm run build && node build"
